<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy IQ Worksheet Generator</title>
<style>
  :root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:#eef1f5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 20px;
    background:#111827; color:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    font-size:14px;
  }
  .tb-title{font-weight:700; margin-right:auto; letter-spacing:.3px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e5e7eb}
  .toolbar input[type=number]{
    width:110px; padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:8px 14px; border-radius:8px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit; font-weight:600; cursor:pointer;
  }
  .toolbar button:hover{background:#374151}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
  .score-chip{
    padding:6px 12px; border-radius:999px;
    background:#1f2937; border:1px solid #374151;
    font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
  }

  /* ---------- sheet ---------- */
  .sheet{
    background:#fff;
    max-width:1080px;
    margin:22px auto 60px;
    padding:30px 34px 42px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .sheet-head h1{margin:0; font-size:26px; letter-spacing:.5px}
  .meta{margin-left:auto; display:flex; gap:18px; font-size:13px; color:#374151}
  .meta .line{display:inline-block; width:110px; border-bottom:1px solid #9ca3af}
  .meta .line.short{width:80px}
  .meta .line.tiny{width:48px}
  .instructions{margin:14px 0 18px; font-size:14px; color:var(--muted)}

  /* ---------- questions ---------- */
  .questions{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
  }
  @media (max-width:760px){ .questions{grid-template-columns:1fr} }

  .q{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px 12px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px}
  .q-num{
    flex:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:13.5px; line-height:1.35; font-weight:600}

  .diagram{
    display:flex; align-items:flex-end; justify-content:center; gap:8px;
    min-height:70px;
    margin:2px 0 12px;
  }
  .item{display:flex; flex-direction:column; align-items:center; gap:3px}
  .item-label{font-size:11px; font-weight:700; color:var(--muted)}
  .item-visual{
    width:60px; height:60px;
    display:flex; align-items:center; justify-content:center;
  }
  .item-visual svg{display:block}

  /* ---- "?" slot: matches the answer-tile footprint exactly ---- */
  .qmark{
    width:54px; height:54px;
    border:2.5px dashed #9ca3af;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:800; color:#9ca3af;
  }

  .grid2{
    display:grid;
    grid-template-columns:repeat(2, auto);
    gap:6px;
    justify-content:center;
  }

  .options{
    display:flex; flex-wrap:wrap; justify-content:center; gap:12px;
    margin-top:auto;
    padding-top:6px;
    border-top:1px dashed #e5e7eb;
  }
  .option{display:flex; flex-direction:column; align-items:center; gap:2px}
  .opt-visual{
    width:60px; height:60px;
    border:1.5px solid var(--line);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:#fafafa;
  }
  .opt-visual svg{display:block}
  .opt-letter{font-size:11px; font-weight:700; color:var(--muted)}
  .opt-text{font-size:22px; font-weight:800; color:var(--ink)}

  /* ---------- interactive answering ---------- */
  .option{
    cursor:grab;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border-radius:10px;
    padding:4px 4px 2px;
    transition:background .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .option:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
  .option:hover{background:#f3f4f6}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; box-shadow:0 0 0 2px #16a34a}
  .option.wrong{background:#fee2e2; box-shadow:0 0 0 2px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    80%{transform:translateX(-3px)}
  }

  /* drop slot */
  .drop-zone{border-radius:12px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:#dbeafe; transform:scale(1.08)}
  .drop-zone.over .qmark{border-color:var(--accent); color:var(--accent); background:#eff6ff}

  /* Keep the dropped shape at its natural 54px size — no scaling, no clipping. */
  .qmark{
    overflow:visible;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark svg{width:54px; height:54px; display:block}
  .qmark .opt-text{font-size:22px}
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
  }

  /* the tile that follows the pointer */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    width:64px; height:64px; border-radius:10px;
    background:#fff; border:1.5px solid var(--line);
    box-shadow:0 10px 22px rgba(15,23,42,.28);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
  }
  .drag-ghost svg{width:54px; height:54px; display:block}
  .drag-ghost .opt-text{font-size:22px; font-weight:800}

  /* per-question feedback line */
  .q-feedback{
    margin-top:8px; min-height:15px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* ---------- answer key ---------- */
  .key{
    margin-top:26px;
    border-top:3px solid var(--ink);
    padding-top:12px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 10px; font-size:16px; letter-spacing:.5px}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:6px 10px;
    font-size:13px;
    color:#374151;
  }
  .key-grid b{color:var(--ink)}

  /* ---------- print ---------- */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#9ca3af}
    .opt-visual{background:#fff}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🧠 Easy IQ Worksheet Generator</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value="12345"></label>
  <label>Questions
    <select id="countSelect">
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
      <option>12</option>
      <option>15</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM  (same seed => same worksheet)
     ============================================================ */
  let rng = Math.random;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ri   = n => Math.floor(rng() * n);
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     SHAPE LIBRARY
     ============================================================ */
  const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'star', 'pentagon', 'hexagon'];
  const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#14b8a6'];
  const SIZES  = [0.55, 0.78, 1.0, 1.25];   // small → large

  /* KEY FIX: the diagram shapes and the answer tiles render at the SAME
     pixel scale.  Before, the diagram used 66px and the options used 54px,
     so a size-1.0 pattern shape looked identical to a size-1.25 option —
     making it appear that the wrong option was marked correct. */
  const CELL = 54;   // pattern/diagram shape size (px)
  const OPT  = 54;   // option shape size (px) — must equal CELL

  function poly(n, cx, cy, r) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }

  function starPts(cx, cy, outer, inner) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rr = (i % 2) ? inner : outer;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }

  function arrowPts(cx, cy, r) {
    const P = [[0, -1], [0.60, -0.12], [0.24, -0.12], [0.24, 0.92],
               [-0.24, 0.92], [-0.24, -0.12], [-0.60, -0.12]];
    return P.map(p => (cx + p[0] * r).toFixed(1) + ',' + (cy + p[1] * r).toFixed(1)).join(' ');
  }

  function shapeInner(kind, cx, cy, r) {
    switch (kind) {
      case 'circle':
        return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;

      case 'square': {
        /* A square is ALWAYS axis-aligned — standing on a side, never a corner. */
        const s = r * 0.92;
        return `<rect x="${(cx - s).toFixed(1)}" y="${(cy - s).toFixed(1)}" width="${(2 * s).toFixed(1)}" height="${(2 * s).toFixed(1)}" rx="${(s * 0.14).toFixed(1)}"/>`;
      }

      case 'triangle': return `<polygon points="${poly(3, cx, cy, r * 1.12)}"/>`;

      case 'diamond': {
        /* A true rhombus: four equal sides, unequal diagonals, so it can
           never be confused with a square turned 45°. */
        const rx = r * 0.76;
        const ry = r * 1.16;
        const pts = [[0, -1], [1, 0], [0, 1], [-1, 0]]
          .map(p => (cx + p[0] * rx).toFixed(1) + ',' + (cy + p[1] * ry).toFixed(1))
          .join(' ');
        return `<polygon points="${pts}"/>`;
      }

      case 'pentagon': return `<polygon points="${poly(5, cx, cy, r * 1.05)}"/>`;
      case 'hexagon':  return `<polygon points="${poly(6, cx, cy, r * 1.00)}"/>`;
      case 'star':     return `<polygon points="${starPts(cx, cy, r * 1.12, r * 0.48)}"/>`;
      case 'arrow':    return `<polygon points="${arrowPts(cx, cy, r * 1.05)}"/>`;
      default:         return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
    }
  }

  /** spec = { shape, color, size, rot } */
  function shapeSVG(spec, px) {
    px = px || CELL;
    const c = px / 2;
    const r = px * 0.33 * (spec.size == null ? 1 : spec.size);
    /* Squares are never rotated, whatever the caller asks for. */
    const rot = (spec.shape === 'square') ? 0 : (spec.rot || 0);
    const sw = Math.max(1.6, px * 0.030);
    return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}" aria-hidden="true" focusable="false">
      <g transform="rotate(${rot} ${c} ${c})"
         fill="${spec.color || '#3b82f6'}"
         stroke="#111827"
         stroke-width="${sw.toFixed(2)}"
         stroke-linejoin="round"
         stroke-linecap="round">${shapeInner(spec.shape, c, c, r)}</g>
    </svg>`;
  }

  /* ============================================================
     SMALL HTML HELPERS
     ============================================================ */
  function itemHTML(visual, label) {
    return `<div class="item">
      ${label ? `<div class="item-label">${label}</div>` : ''}
      <div class="item-visual">${visual}</div>
    </div>`;
  }

  const qmarkHTML = () => `<div class="item drop-zone">
      <div class="item-visual"><div class="qmark">?</div></div>
    </div>`;

  /* ============================================================
     QUESTION GENERATORS
     ============================================================ */

  /* --- 1. SEQUENCE ----------------------------------------- */
  function genSequence() {
    const mode = pick(['shape', 'color', 'size']);
    const cycleLen = 2 + ri(2);
    const baseShape = pick(SHAPES);
    const baseColor = pick(COLORS);

    let cycle;
    if (mode === 'shape') {
      cycle = shuffle(SHAPES).slice(0, cycleLen);
    } else if (mode === 'color') {
      cycle = shuffle(COLORS).slice(0, cycleLen);
    } else {
      /* SIZE MODE
         - 2-cycle: two clearly-separated sizes (never adjacent values).
         - 3-cycle: three consecutive sizes running one direction. */
      if (cycleLen === 2) {
        const pairs = [[0, 3], [0, 2], [1, 3]];
        const p = pairs[ri(pairs.length)];
        const ascending = rng() < 0.5;
        cycle = ascending ? [SIZES[p[0]], SIZES[p[1]]]
                          : [SIZES[p[1]], SIZES[p[0]]];
      } else {
        const ascending = rng() < 0.5;
        const start = ri(2);   // 0 or 1
        cycle = [SIZES[start], SIZES[start + 1], SIZES[start + 2]];
        if (!ascending) cycle.reverse();
      }
    }

    const at = i => {
      const v = cycle[i % cycle.length];
      if (mode === 'shape') return { shape: v, color: baseColor, size: 1 };
      if (mode === 'color') return { shape: baseShape, color: v, size: 1 };
      return { shape: baseShape, color: baseColor, size: v };
    };

    const shown = 4;
    const items = [];
    for (let i = 0; i < shown; i++) items.push(at(i));
    const answerSpec = at(shown);

    let pool;
    if (mode === 'shape') {
      pool = SHAPES.filter(s => s !== answerSpec.shape)
                   .map(s => ({ shape: s, color: baseColor, size: 1 }));
    } else if (mode === 'color') {
      pool = COLORS.filter(c => c !== answerSpec.color)
                   .map(c => ({ shape: baseShape, color: c, size: 1 }));
    } else {
      pool = SIZES.filter(s => s !== answerSpec.size)
                  .map(s => ({ shape: baseShape, color: baseColor, size: s }));
    }

    const distractors = shuffle(pool).slice(0, 3);
    const opts = shuffle([{ spec: answerSpec, ok: true },
                          ...distractors.map(d => ({ spec: d, ok: false }))]);

    /* Diagram shapes use OPT (same scale as options) so the correct
       answer tile visually matches the pattern. */
    return {
      prompt: 'What comes next in the pattern?',
      diagram: items.map(s => itemHTML(shapeSVG(s, OPT))).join('') + qmarkHTML(),
      options: opts.map(o => ({ svg: shapeSVG(o.spec, OPT) })),
      answer: opts.findIndex(o => o.ok)
    };
  }

  /* --- 2. ODD ONE OUT -------------------------------------- */
  function genOddOneOut() {
    const baseShape = pick(SHAPES);
    const baseColor = pick(COLORS);
    const base = { shape: baseShape, color: baseColor, size: 1 };

    let odd;
    if (pick(['shape', 'color']) === 'shape') {
      odd = { shape: pick(SHAPES.filter(s => s !== baseShape)), color: baseColor, size: 1 };
    } else {
      odd = { shape: baseShape, color: pick(COLORS.filter(c => c !== baseColor)), size: 1 };
    }

    const items = shuffle([base, base, base, odd]);
    const labels = ['A', 'B', 'C', 'D'];
    const answer = items.findIndex(x => x === odd);

    return {
      prompt: 'Which picture is different from the others?',
      diagram: items.map((s, i) => itemHTML(shapeSVG(s, OPT), labels[i])).join(''),
      options: labels.map(l => ({ text: l })),
      hideLetters: true,
      answer
    };
  }

  /* --- 3. MATRIX (2×2 analogy) ----------------------------- */
  function genMatrix() {
    const pair = shuffle(SHAPES).slice(0, 2);
    const cpair = shuffle(COLORS).slice(0, 2);
    const [sA, sB] = pair;
    const [cA, cB] = cpair;

    const tl = { shape: sA, color: cA, size: 1 };
    const tr = { shape: sB, color: cA, size: 1 };
    const bl = { shape: sA, color: cB, size: 1 };
    const br = { shape: sB, color: cB, size: 1 };   // <-- the answer

    const diagram = `<div class="grid2">
      ${itemHTML(shapeSVG(tl, OPT))}
      ${itemHTML(shapeSVG(tr, OPT))}
      ${itemHTML(shapeSVG(bl, OPT))}
      ${qmarkHTML()}
    </div>`;

    const opts = shuffle([
      { spec: br,                                ok: true  },
      { spec: { shape: sB, color: cA, size: 1 }, ok: false },
      { spec: { shape: sA, color: cB, size: 1 }, ok: false },
      { spec: { shape: sA, color: cA, size: 1 }, ok: false }
    ]);

    return {
      prompt: 'Which picture belongs in the empty square?',
      diagram,
      options: opts.map(o => ({ svg: shapeSVG(o.spec, OPT) })),
      answer: opts.findIndex(o => o.ok)
    };
  }

  /* --- 4. COUNTING ----------------------------------------- */
  function genCounting() {
    const kinds = shuffle(['circle', 'square', 'triangle', 'star', 'diamond', 'hexagon']).slice(0, 3);
    const target = kinds[0];
    const others = kinds.slice(1);

    const total = 9 + ri(4);            // 9..12 shapes
    const targetCount = 3 + ri(2);      // 3..4 targets

    const flags = [];
    for (let i = 0; i < total; i++) flags.push(i < targetCount);
    const order = shuffle(flags);

    const specs = order.map(isT => ({
      shape: isT ? target : pick(others),
      color: pick(COLORS),
      size: 1
    }));

    const diagram = scatterSVG(specs);

    const cands = [];
    for (let d = 1; d <= total; d++) if (d !== targetCount) cands.push(d);
    cands.sort((a, b) => Math.abs(a - targetCount) - Math.abs(b - targetCount));
    const wrongs = shuffle(cands.slice(0, 5)).slice(0, 3);

    const opts = shuffle([{ n: targetCount, ok: true },
                          ...wrongs.map(w => ({ n: w, ok: false }))]);

    return {
      prompt: `How many ${target}s can you count?`,
      diagram,
      options: opts.map(o => ({ text: String(o.n) })),
      answer: opts.findIndex(o => o.ok)
    };
  }

  function scatterSVG(specs) {
    const W = 280, H = 168, cols = 5, rows = 3;
    const cw = W / cols, ch = H / rows;
    const allCells = shuffle([...Array(cols * rows).keys()]).slice(0, specs.length);

    let inner = '';
    specs.forEach((spec, i) => {
      const k = allCells[i];
      const col = k % cols, row = Math.floor(k / cols);
      const cx = cw * (col + 0.5) + (rng() - 0.5) * (cw * 0.18);
      const cy = ch * (row + 0.5) + (rng() - 0.5) * (ch * 0.18);
      const r  = Math.min(cw, ch) * 0.30 * (0.78 + rng() * 0.28);
      inner += `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)})"
                   fill="${spec.color}" stroke="#111827" stroke-width="2"
                   stroke-linejoin="round">${shapeInner(spec.shape, 0, 0, r)}</g>`;
    });

    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">${inner}</svg>`;
  }

  /* --- 5. ROTATION ----------------------------------------- */
  function genRotation() {
    const start = ri(4) * 90;
    const step  = pick([90, 90, 90, -90]);
    const clockwise = step === 90;
    const color = pick(COLORS);

    const items = [0, 1, 2].map(i =>
      itemHTML(shapeSVG({ shape: 'arrow', color, rot: (start + step * i + 720) % 360, size: 1 }, OPT))
    );

    const answerRot = (start + step * 3 + 720) % 360;
    const rots = shuffle([0, 90, 180, 270]);
    const opts = rots.map(r => ({ r, ok: r === answerRot }));

    return {
      prompt: `The arrow turns 90° ${clockwise ? 'clockwise' : 'counter-clockwise'} each time. Which arrow comes next?`,
      diagram: items.join('') + qmarkHTML(),
      options: opts.map(o => ({ svg: shapeSVG({ shape: 'arrow', color, rot: o.r, size: 1 }, OPT) })),
      answer: opts.findIndex(o => o.ok)
    };
  }

  /* ============================================================
     ASSEMBLY
     ============================================================ */
  const GENERATORS = {
    sequence: genSequence,
    odd:      genOddOneOut,
    matrix:   genMatrix,
    counting: genCounting,
    rotation: genRotation
  };

  function buildTypeList(n) {
    const all = Object.keys(GENERATORS);
    const out = [];
    while (out.length < n) out.push(...shuffle(all));
    return out.slice(0, n);
  }

  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) => {
      const visual = o.svg ? o.svg : `<span class="opt-text">${o.text}</span>`;
      return `<div class="option" data-opt="${j}" role="button" tabindex="0"
                   aria-label="Answer ${LETTERS[j]}">
        <div class="opt-visual">${visual}</div>
        ${q.hideLetters ? '' : `<div class="opt-letter">${LETTERS[j]}</div>`}
      </div>`;
    }).join('');

    return `<article class="q" data-q="${i}">
      <div class="q-head">
        <span class="q-num">${i + 1}</span>
        <span class="q-prompt">${q.prompt}</span>
      </div>
      <div class="diagram">${q.diagram}</div>
      <div class="options">${optsHTML}</div>
      <div class="q-feedback" aria-live="polite"></div>
    </article>`;
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);

    questions = buildTypeList(n).map(t => GENERATORS[t]());
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => `<span>${i + 1}. <b>${LETTERS[q.answer]}</b></span>`)
      .join('');

    sheet.innerHTML = `
      <header class="sheet-head">
        <h1>Easy IQ Practice</h1>
        <div class="meta">
          <span>Name: <span class="line"></span></span>
          <span>Date: <span class="line short"></span></span>
          <span>Score: <span class="line tiny"></span></span>
        </div>
      </header>
      <p class="instructions">
        Drag the correct picture into the <b>?</b> box — or simply tap/click an answer.
        You'll be told straight away whether you're right. (Seed: <span id="seedTag"></span>)
      </p>
      <div class="questions">${questions.map(renderQuestion).join('')}</div>
      <section class="key" id="keySection">
        <h2>Answer Key</h2>
        <div class="key-grid">${keyGrid}</div>
      </section>
    `;

    document.getElementById('seedTag').textContent =
      document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION — drag a tile into the "?" slot, or tap it
     ============================================================ */
  const PRAISE = ['Correct! 🎉', 'Yes! Well done.', "That's right! ⭐", 'Great job! 👏', 'Perfect! ✅'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot   = qEl.querySelector('.drop-zone .qmark');
    const visual = opt.querySelector('.opt-visual');
    if (slot && visual) {
      slot.innerHTML = visual.innerHTML;
      slot.classList.add('filled');
    }

    if (idx === q.answer) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite — try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.innerHTML = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = Math.floor(Math.random() * 1e9);
    applySeed();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);
  seedInput.addEventListener('change', () => { applySeed(); render(); });
  countSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  applySeed();
  render();
})();
</script>
</body>
</html>
